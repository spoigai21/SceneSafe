[project]
name = "scenesafe"
version = "0.1.0"
description = "Contextual ad matching and brand safety from video, with measured throughput and cost"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "open_clip_torch>=2.24",
    "av>=12",
    "numpy",
    "pillow",
    "pyyaml",
    "truststore",
    "matplotlib",
    "onnx",
    "onnxruntime",
    "faiss-cpu",
    "transformers",       # tokenizer for the Phase 4c SigLIP2 model
    "sentencepiece",
    "mlx-whisper; sys_platform == 'darwin'",   # Phase 4f speech-to-text (Apple silicon)
    "mlx-vlm; sys_platform == 'darwin'",       # Phase 4g scene cards (Apple silicon)
    "sentence-transformers",                   # Phase 4f dialogue embeddings
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["scenesafe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
