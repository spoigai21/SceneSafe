[project]
name = "scenesafe"
version = "0.1.0"
description = "Contextual ad matching and brand safety from video, with measured throughput and cost"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "open_clip_torch>=2.24",
    "av>=12",
    "numpy",
    "pillow",
    "pyyaml",
    "truststore",
    "matplotlib",
    "onnx",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["scenesafe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
