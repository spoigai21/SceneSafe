# Simulated ad catalogue for Phase 4 (and Phase 5 constraints). These are not real ads or real advertisers.
# Written once, before any Phase 4 results, and frozen for the test measurement.
#
# brief:       the text that CLIP embeds to find matching scenes
# genres:      what the genre-only baseline uses. The genres a media planner would pick for this ad if all they
#              knew about each film was its genre label. Chosen from the ad's subject, not from looking at films.
# avoid:       content this advertiser refuses to appear next to. Recorded here, enforced in Phase 5, not Phase 4.
#              Vocabulary: violence, weapons, accidents, death, horror, alcohol, smoking.
ads:
  - id: car
    category: automotive
    brief: a car driving on an open road
    genres: [crime, drama]
    avoid: [accidents, violence]

  - id: airline
    category: travel
    brief: an airplane in the sky or at an airport
    genres: [adventure, scifi]
    avoid: [accidents, death]

  - id: cruise
    category: travel
    brief: a ship sailing on the open sea
    genres: [adventure]
    avoid: [accidents, death]

  - id: beach_resort
    category: travel
    brief: a sunny beach by the sea
    genres: [comedy, adventure]
    avoid: [violence, death]

  - id: beer
