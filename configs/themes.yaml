# Phase 4e themes (EVAL-PROTOCOL.md, "Phase 4e amendment"). Simulated ads; written before any Phase 4e run, frozen
# with the amendment.
#
# theme:  what counts as a THEMATIC fit (label 1) for the judge: the scene is about the ad's world or mood, even if the
#         product or literal subject is not on screen. A literal fit (label 2) is the Phase 4d guide's "fits" line.
# query:  3 short phrases the theme system embeds alongside the literal brief (one fixed set per ad, written once).
